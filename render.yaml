#
# Checks are due every `intervalMinutes` (15 by default) per session, not every
# few seconds -- `run_attendance_checker --once` scans, fires whatever is due and
# exits, which is exactly a cron job's shape. Without it, checks only happen
# while a host's browser tab is open.
