# Render blueprint for the Podium API.
#
#   Dashboard -> New -> Blueprint -> pick this repository.
#
# This deploys the API, its database, and the web interface. The web app is
# built from this repository and served as a static site (see `podium-web`
# below); calls and recording come from LiveKit Cloud. Nothing here needs
# Docker: gunicorn runs directly on Render's Python runtime, and WhiteNoise
# serves the Django admin's static files because there is no nginx in front of
# the process.
#
# The web app used to be uploaded by hand to a shared panel host. That made a
# single third party -- its file manager, its TLS, its cache -- a hard
# dependency of every sign-in: when it stopped answering HTTPS, the SPA could
# not be fetched at all and "login is broken" was really "the app is not there".
# Building it here removes that dependency and makes a deploy a git push.
#
# Secrets are marked `sync: false`: Render prompts for them on first deploy and
# stores them encrypted. They are never written into this file.

databases:
  - name: podium-db
    databaseName: podium
    user: podium
    # Free Postgres is fine for a trial and expires after ~30 days; move to a
    # paid plan before real classes depend on it.
    plan: free
    region: frankfurt

services:
  - type: web
    name: podium-api
    runtime: python
    # A free instance sleeps after ~15 minutes idle and takes 30-60s to wake.
    # Both clients retry a cold connection once (ColdStartRetryInterceptor on
    # Android, client.ts on the web) so the first request of the day is slow
    # rather than "server unreachable".
    plan: free
    region: frankfurt
    # The Django project lives in backend/, not at the repository root.
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # Migrations run here rather than in a pre-deploy command: pre-deploy
    # commands need a paid instance, and skipping them on the free plan would
    # serve requests against an empty schema. `migrate` is a no-op once the
    # schema is current, so running it on every boot costs a second.
    # `ensure_admin` exists because a free instance has no Shell, so
    # createsuperuser cannot be run by hand; it does nothing unless the
    # DJANGO_ADMIN_* variables are set.
    startCommand: "python manage.py migrate --noinput && python manage.py ensure_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile -"
    # Readiness, not liveness: it checks the database and pending migrations, so
    # a deploy that cannot reach Postgres never replaces a working instance.
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: podium-api.onrender.com
      # Render terminates TLS and forwards X-Forwarded-Proto; without this
      # Django treats every request as plain http and the admin's CSRF check
      # fails. The redirect itself is Render's job, so Django must not repeat it
      # (it would redirect the internal health probe in a loop).
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: podium-db
          property: connectionString
      # The static front end's origin. The browser calls this API cross-origin,
      # so every origin the SPA is served from belongs here. Keep in step with
      # VITE_GOOGLE_ALLOWED_ORIGINS on podium-web and with the Google OAuth
      # client's "Authorized JavaScript origins".
      - key: CORS_ALLOWED_ORIGINS
        value: https://podium-web.onrender.com,https://podiumclass.online,https://www.podiumclass.online,https://minatoflash82.ifnotus.space
      - key: CSRF_TRUSTED_ORIGINS
        value: https://podium-api.onrender.com
      # Bootstrap administrator. Render prompts for these on first deploy
      # because of `sync: false`; the start command creates (or repairs) the
      # account on boot, since the free plan has no Shell to run
      # createsuperuser in. Unset both afterwards.
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      # LiveKit Cloud: the project's URL, key and secret. Room tokens are signed
      # with this pair, so a wrong value makes every join fail with an
      # unhelpful "invalid token".
      #
      # LIVEKIT_URL must be a real endpoint -- wss://<project>.livekit.cloud --
      # not a placeholder. A value like "pending" is rejected at join time with
      # LIVEKIT_NOT_CONFIGURED naming this setting, instead of being handed to
      # the client and failing there as "no scheme was found for pending".
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Render's filesystem is ephemeral: these survive while the instance is up
      # and are lost on every deploy and restart. Fine for a trial; the real fix
      # is object storage, which recordings need anyway (LiveKit Cloud egress
      # writes to a bucket, not to local disk).
      - key: RECORDINGS_ROOT
        value: /tmp/recordings
      - key: MATERIALS_ROOT
        value: /tmp/materials
      - key: AVATARS_ROOT
        value: /tmp/avatars
      - key: MAX_UPLOAD_BYTES
        value: "104857600"

  # -------------------------------------------------------------------------
  # Web interface (static site).
  #
  # Built from frontend/ on every push and served from Render's CDN, so the web
  # app no longer depends on the panel host at all.
  #
  # No rewrite rules: the router uses hash history, so the browser only ever
  # requests `/` and each route lives after the `#`. A catch-all rewrite would
  # be dead weight at best and is the classic way to shadow /assets/ at worst.
  # -------------------------------------------------------------------------
  - type: web
    name: podium-web
    runtime: static
    rootDir: frontend
    # `--include=dev` is explicit because vue-tsc and vite are devDependencies:
    # a production-only install would fail with "vite: not found".
    buildCommand: "npm ci --include=dev && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Vite inlines VITE_* values at build time, so these are the settings the
      # shipped JavaScript carries. They mirror BUILD_ENV_DEFAULTS in
      # deploy/publish_frontend.py, which does the same for the panel host.
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_URL
        value: https://podium-api-r6sz.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 148808386481-qp65l50jmuabfte437aafmh85esth944.apps.googleusercontent.com
      # Origins the sign-in button may open from. A page on an origin missing
      # here refuses to start the popup, because Google's answer to an
      # unregistered origin (origin_mismatch) is drawn inside a window this app
      # cannot read, and would look like a dead button.
      - key: VITE_GOOGLE_ALLOWED_ORIGINS
        value: https://podium-web.onrender.com,https://podiumclass.online,https://www.podiumclass.online,https://minatoflash82.ifnotus.space
    headers:
      # Hashed build output is immutable by construction.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The service worker and the entry document must never be cached: a stale
      # copy keeps serving an old shell and updates stop arriving.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

