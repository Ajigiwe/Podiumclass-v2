<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Podium</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192x192.png">
    <link rel="icon" type="image/png" href="./icon-192x192.png">
    <meta name="theme-color" content="#1845D4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/podium.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="./js/theme-init.js"></script>
    <link rel="stylesheet" href="./css/index.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Outfit', serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #DDE0F0; border-radius: 10px; }
        .sidebar-active { background-color: #E8EEFF; color: #1845D4; }
    </style>
</head>
<body class="bg-[#F5F6FA] text-[#0D0D1A] dark:bg-slate-950 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">
    <div id="top-loading-bar" class="fixed top-0 left-0 h-[2px] bg-[#1845D4] z-[100] transition-all duration-300"></div>
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="hidden lg:flex w-60 flex-col fixed inset-y-0 bg-white dark:bg-slate-900 border-r border-[#DDE0F0] dark:border-slate-800 z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div class="lg:hidden absolute top-4 right-4">
                <button id="close-mobile-menu" class="p-2 text-[#8888A8] hover:text-[#0D0D1A]">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <a href="/" class="h-[60px] px-6 flex items-center border-b border-[#DDE0F0] dark:border-slate-800 font-serif text-[1.3rem] text-[#1845D4] font-black tracking-tighter decoration-none">Podium</a>
            
            <nav class="flex-1 px-3 py-6 overflow-y-auto">
                <div class="px-3 mb-2 text-[10px] font-bold text-[#8888A8] uppercase tracking-[0.1em]">Main</div>
                <div class="space-y-0.5">
                    <a href="./dashboard.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-[13px] font-medium transition-all text-[#444460] dark:text-slate-400 hover:bg-[#F5F6FA] dark:hover:bg-slate-950 hover:text-[#0D0D1A] dark:hover:text-slate-100">
                        <i class="fas fa-layer-group w-4 h-4"></i> Records
                    </a>
                    <a href="./dashboard.html?tab=communities" class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-[13px] font-medium transition-all text-[#444460] dark:text-slate-400 hover:bg-[#F5F6FA] dark:hover:bg-slate-950 hover:text-[#0D0D1A] dark:hover:text-slate-100">
                        <i class="fas fa-users w-4 h-4"></i> Communities
                    </a>
                    <a href="./dashboard.html?tab=attendance" id="nav-attendance" class="hidden flex items-center gap-2.5 px-3 py-2.5 rounded-md text-[13px] font-medium transition-all text-[#444460] dark:text-slate-400 hover:bg-[#F5F6FA] dark:hover:bg-slate-950 hover:text-[#0D0D1A] dark:hover:text-slate-100">
                        <i class="fas fa-clipboard-list w-4 h-4"></i> Attendance
                    </a>
                    <a href="./history.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-[13px] font-medium transition-all sidebar-active">
                        <i class="fas fa-history w-4 h-4"></i> History
                    </a>
                </div>
            </nav>

            <div class="p-3 border-t border-[#DDE0F0] dark:border-slate-800 space-y-1">
                <button id="theme-toggle" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-md text-[13px] font-medium transition-all text-[#8888A8] hover:bg-[#F5F6FA] dark:hover:bg-slate-950 group">
                    <i id="theme-icon" class="fas fa-moon w-4 h-4"></i> Theme
                </button>
                <a href="./profile.html" id="user-profile-preview" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-[#F5F6FA] dark:hover:bg-slate-950 transition-all group">
                    <div id="user-avatar" class="w-8 h-8 rounded-full bg-[#1845D4] flex items-center justify-center text-white text-[10px] font-bold overflow-hidden shadow-sm">U</div>
                    <div class="flex-1 min-w-0">
                        <p id="user-name" class="text-[13px] font-bold text-[#0D0D1A] dark:text-slate-100 truncate">User</p>
                        <p id="user-role" class="text-[10px] font-bold text-[#8888A8] dark:text-slate-400 uppercase tracking-widest truncate">Student</p>
                    </div>
                </a>
                <button id="logout-btn" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-md text-[13px] font-medium text-[#8888A8] hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all">
                    <i class="fas fa-sign-out-alt w-4 h-4"></i> Sign Out
                </button>
            </div>
        </aside>

        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-[#0D0D1A]/40 backdrop-blur-sm z-40 hidden lg:hidden"></div>

        <!-- Mobile Header -->
        <div class="lg:hidden fixed top-0 left-0 right-0 h-16 bg-white dark:bg-slate-900 border-b border-[#DDE0F0] dark:border-slate-800 flex items-center justify-between px-6 z-40">
            <a href="/" class="font-serif font-black text-[#1845D4] text-lg tracking-tighter">Podium</a>
            <button id="mobile-menu-btn" class="p-2 text-[#0D0D1A] dark:text-slate-200 bg-[#F5F6FA] dark:bg-slate-800 rounded-md">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 lg:pl-60 pt-16 lg:pt-0">
            <div class="flex-1 p-8 lg:p-10 max-w-4xl mx-auto w-full space-y-8">
                <!-- Header -->
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-2">
                    <div>
                        <h1 class="text-3xl font-sans text-[#0D0D1A] dark:text-slate-100 tracking-tighter">History</h1>
                        <p class="text-[13px] text-[#8888A8] font-medium mt-1">Review your academic records</p>
                    </div>
                    <div class="flex w-full md:w-auto p-1 bg-white dark:bg-slate-900 border border-[#DDE0F0] dark:border-slate-800 rounded-lg shadow-sm">
                        <button onclick="window.switchTab('joined')" id="tab-joined" class="flex-1 md:flex-none px-4 py-2 text-[10px] font-bold uppercase tracking-[0.15em] rounded transition-all bg-[#1845D4] text-white">Classes Joined</button>
                        <button onclick="window.switchTab('hosted')" id="tab-hosted" class="flex-1 md:flex-none px-4 py-2 text-[10px] font-bold uppercase tracking-[0.15em] rounded transition-all text-[#8888A8] hover:text-[#0D0D1A] dark:hover:text-slate-100">Classes Hosted</button>
                    </div>
                </div>

                <!-- Stat Card -->
                <div class="bg-white dark:bg-slate-900 border border-[#DDE0F0] dark:border-slate-800 rounded-lg p-6 shadow-sm inline-block min-w-[240px]">
                    <div class="text-[11px] font-bold text-[#8888A8] uppercase tracking-[0.08em] mb-2">Total Records</div>
                    <div class="flex items-center justify-between gap-12">
                        <div id="history-total" class="text-3xl font-sans text-[#0D0D1A] dark:text-slate-100 tracking-tight">0</div>
                        <i class="fas fa-history text-[#1845D4] text-xl"></i>
                    </div>
                </div>

                <!-- History List -->
                <div class="bg-white dark:bg-slate-900 border border-[#DDE0F0] dark:border-slate-800 rounded-lg overflow-hidden shadow-sm">
                    <div id="history-list" class="divide-y divide-[#DDE0F0] dark:divide-slate-800">
                        <div class="py-16 text-center text-[#8888A8] text-[11px] font-bold uppercase tracking-widest italic">Loading records...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Attendance Modal (Stub for parity) -->
    <div id="modal-attendance" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-[#0D0D1A]/40 backdrop-blur-sm" onclick="this.parentElement.classList.add('hidden')"></div>
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-lg p-10 relative shadow-2xl overflow-y-auto max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-sans text-[#0D0D1A] dark:text-slate-100 tracking-tighter">Attendance Logs</h2>
                <button id="download-attendance-btn" class="hidden px-4 py-2 bg-[#1845D4] text-white text-[10px] font-bold uppercase tracking-widest rounded flex items-center gap-2 hover:bg-[#0F2FA8] transition-all shadow-lg shadow-blue-600/10 active:scale-95">
                    <i class="fas fa-download text-xs"></i> Export CSV
                </button>
            </div>
            <div id="attendance-logs-content" class="space-y-4"></div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module" src="./js/sidebar.js?v=9"></script>
    <script type="module" src="./js/history.js?v=9"></script>
    <script src="./js/theme-toggle.js"></script>
</body>
</html>
