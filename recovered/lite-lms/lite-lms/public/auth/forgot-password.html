<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Podium</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icon-192x192.png">
    <link rel="icon" type="image/png" href="../icon-192x192.png">
    <meta name="theme-color" content="#1845D4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/podium.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../js/theme-init.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Outfit', serif; }
    </style>
</head>
<body class="bg-[#F5F6FA] dark:bg-slate-950 text-[#0D0D1A] dark:text-slate-100 min-h-screen flex items-center justify-center p-6 transition-colors duration-200">
    <!-- Theme Toggle -->
    <div class="fixed top-6 right-6">
        <button id="theme-toggle" class="p-3 bg-white dark:bg-slate-900 border border-[#DDE0F0] dark:border-slate-800 rounded-xl shadow-sm hover:border-[#1845D4] transition-all group">
            <i id="theme-icon" class="fas fa-moon text-[#8888A8] group-hover:text-[#1845D4]"></i>
        </button>
    </div>
    <div class="max-w-[380px] w-full space-y-8 animate-in fade-in duration-500">
        <!-- Logo -->
        <div class="text-center space-y-6">
            <a href="/" class="inline-flex items-center justify-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-[#1845D4] flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
            </a>
            <div class="space-y-1">
                <h2 class="text-3xl font-serif text-[#0D0D1A] dark:text-white tracking-tighter">Google sign-in</h2>
                <p class="text-[#8888A8] dark:text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                    Podium no longer uses passwords
                </p>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-[#DDE0F0] dark:border-slate-800 p-6 sm:p-10 shadow-sm text-center space-y-5">
            <p class="text-[13px] text-[#4A4A6A] dark:text-slate-300 leading-relaxed">
                Your Podium account is secured by Google. There is no Podium password to reset.
            </p>
            <a href="./login.html" class="w-full flex justify-center py-3.5 bg-[#1845D4] hover:bg-[#0F2FA8] text-white rounded-md font-bold text-[11px] uppercase tracking-widest transition-all shadow-lg shadow-blue-600/10 active:scale-95">
                Continue with Google
            </a>
            <a href="./login.html" class="inline-flex items-center gap-2 text-[10px] font-bold text-[#8888A8] hover:text-[#1845D4] uppercase tracking-widest transition-colors">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>
    </div>
    <script src="../js/theme-toggle.js"></script>
</body>
</html>
