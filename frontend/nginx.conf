# Serves the built SPA and puts the API on the same origin.
#
# Same-origin matters: the browser never makes a cross-origin request, so the
# deployment needs no CORS allowlist, no second hostname, and the cookies
# Django's admin uses work without extra configuration.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. The backend is addressed through a variable
    # (see $backend below) so its address is looked up per request instead of
    # once at startup: a deploy recreates the backend container with a new IP,
    # and a resolved-at-boot nginx would keep proxying to the dead one, turning
    # every API call into a 502 until the frontend was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Classroom materials (slides, PDFs) are capped at 100MB by the backend;
    # nginx must not be the smaller limit, or the upload dies with a bare 413.
    client_max_body_size 120m;

    # Recordings are streamed back through the API; a slow phone connection
    # must not be cut at the default 60s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff font/woff2;

    # Liveness for the container healthcheck only -- it must not depend on the
    # backend, or a backend restart would mark the web container unhealthy too.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Not $scheme: nginx itself speaks http behind Caddy's TLS. Forwarding
        # Caddy's value is what makes Django see the request as https
        # (SECURE_PROXY_SSL_HEADER), which admin CSRF and absolute URLs rely on.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        # API responses are per-user; never let a proxy cache them.
        proxy_buffering off;
    }

    location /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        # Caddy is the only thing that can reach this container, and it always
        # supplies the real scheme. $scheme here would be http (nginx listens on
        # 80), which would make Django treat an https request as insecure.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django admin styling/JS. Written by collectstatic into a volume shared
    # with the backend container.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # Client-side routes (/classroom/:id, /attendance, ...) all resolve to the
    # SPA shell; anything with a file extension that is genuinely missing still
    # 404s instead of returning HTML with a script MIME type.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
