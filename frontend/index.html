<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1845D4" />
    <meta
      name="description"
      content="Podium is a live virtual classroom: HD video, verified attendance, shared materials, a whiteboard and recordings, on the web and Android."
    />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Podium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Podium" />
    <meta name="msapplication-TileColor" content="#1845D4" />
    <meta name="format-detection" content="telephone=no" />

    <title>Podium - Virtual Classroom</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Original Podium CSS & Theme -->
    <link rel="stylesheet" href="/css/podium.css">
    <link rel="stylesheet" href="/css/index.css">

    <!--
      Boot splash.

      Drawn before a byte of the bundle executes, so a standalone launch (or a
      slow connection) shows the brand instead of a white flash. main.ts removes
      it once Vue has mounted; the CSS fallback fades it even if that never
      happens, so it can never trap the user on a blue screen.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 50% 20%, #2a5aea 0%, #1845D4 45%, #0f2fa8 100%);
        color: #fff;
        transition: opacity 320ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .boot-mark {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.45);
        animation: bootRise 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .boot-mark img {
        width: 46px;
        height: 46px;
        display: block;
      }

      .boot-ring {
        position: absolute;
        inset: -14px;
        border-radius: 30px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        animation: bootRing 2.4s ease-out infinite;
      }

      .boot-name {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.03em;
        animation: bootRise 620ms 90ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .boot-bar {
        position: relative;
        width: 132px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.24);
      }

      .boot-bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: 999px;
        background: #fff;
        animation: bootBar 1.15s ease-in-out infinite;
      }

      @keyframes bootRise {
        from { opacity: 0; transform: translateY(14px) scale(0.94); }
        to { opacity: 1; transform: none; }
      }

      @keyframes bootRing {
        0% { opacity: 0.5; transform: scale(0.9); }
        70% { opacity: 0; transform: scale(1.12); }
        100% { opacity: 0; transform: scale(1.12); }
      }

      @keyframes bootBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }

      /* A launch must not animate for someone who asked it not to. */
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-name,
        .boot-ring,
        .boot-bar span {
          animation: none;
        }
        #boot-splash {
          transition: none;
        }
        .boot-bar span {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="bg-[#F8F9FC] text-[#0D0D1A] dark:bg-slate-950 dark:text-slate-100 font-sans selection:bg-blue-100 transition-colors duration-200">
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading Podium">
      <div class="boot-mark">
        <span class="boot-ring"></span>
        <img src="/icon-192x192.png" alt="" width="46" height="46" />
      </div>
      <div class="boot-name">Podium</div>
      <div class="boot-bar"><span></span></div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Podium needs JavaScript enabled to run.
      </p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
