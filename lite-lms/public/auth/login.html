<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Podium</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icon-192x192.png">
    <link rel="icon" type="image/png" href="../icon-192x192.png">
    <meta name="theme-color" content="#1845D4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/podium.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../js/theme-init.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #F5F6FA; }
        .font-serif { font-family: 'Outfit', serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative bg-cover bg-center" style="background-image: url('../s4.jpg');">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px]"></div>

    <div class="relative z-10 w-full max-w-[360px] animate-in">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-[#1845D4] flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i class="fas fa-graduation-cap text-white text-lg"></i>
                </div>
                <span class="text-2xl font-serif font-black text-white tracking-tighter drop-shadow-md">Podium</span>
            </a>
        </div>

        <div class="bg-white/10 backdrop-blur-2xl rounded-2xl border border-white/20 p-6 sm:p-8 shadow-2xl text-center">
            <h2 class="text-xl font-bold text-white mb-1">Welcome back</h2>
            <p class="text-white/60 text-xs mb-6">Sign in to access your workspace</p>

            <div id="error-container" class="hidden mb-4 rounded-lg bg-red-500/20 border border-red-500/30 p-3">
                <p id="error-message" class="text-xs text-red-100 font-medium"></p>
            </div>

            <button type="button" id="google-btn" class="w-full flex items-center justify-center gap-3 py-3 bg-white rounded-xl text-sm font-semibold text-gray-800 hover:bg-gray-50 transition-all active:scale-[0.98] shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>

            <p class="text-center text-xs text-white/60 mt-6">
                New to Podium? <a href="./register.html" class="text-white font-semibold hover:underline">Create account</a>
            </p>
        </div>
    </div>

    <script src="../js/theme-toggle.js"></script>

    <script type="module">
        import { auth, onAuthStateChanged, signInWithGoogle } from '../js/auth-client.js?v=1';

        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const showError = (msg) => { errorMessage.textContent = msg; errorContainer.classList.remove('hidden'); };

        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            showError('Google sign-in was cancelled or failed. Please try again.');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = '../dashboard.html';
        });

        document.getElementById('google-btn').onclick = async () => {
            errorContainer.classList.add('hidden');
            try {
                await signInWithGoogle('../dashboard.html');
            } catch (err) {
                showError(err?.message || 'Sign in failed. Please try again.');
            }
        };
    </script>
</body>
</html>
